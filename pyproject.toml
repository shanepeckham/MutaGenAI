[project]
name = "MutaGenAI"
version = "0.1.0"
description = "MutaGenAI — Evolutionary prompt optimisation for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MutaGenAI Contributors"},
]
keywords = [
    "prompt-engineering",
    "prompt-evolution",
    "llm",
    "tool-calling",
    "agent",
    "optimisation",
    "evolutionary",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "datasets>=4.8.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["httpx>=0.27", "azure-identity>=1.15"]
viz = ["matplotlib>=3.8", "plotly>=5.18"]
wizard = ["rich>=13.0"]
redteam = ["pyrit>=0.14"]
all = [
    "httpx>=0.27",
    "azure-identity>=1.15",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "rich>=13.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.scripts]
MutaGenAI = "MutaGenAI.wizard:run_wizard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["MutaGenAI"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 100
